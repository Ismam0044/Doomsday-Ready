services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file: .env
    ports:
      - "3001:3001"
  web:
    build:
      context: .
      dockerfile: client/Dockerfile
    environment:
      API_PROXY_TARGET: http://api:3001
    ports:
      - "5173:5173"
    depends_on:
      - api
